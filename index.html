<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>for you ❤️</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
  body {
    margin: 0;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: #333;
  }
  .container {
    text-align: center;
    background: rgba(255,255,255,0.92);
    padding: 35px;
    border-radius: 30px;
    box-shadow: 0 10px 40px rgba(233,30,99,0.2);
    z-index: 10;
    max-width: 550px;
    width: 90%;
    max-height: 85vh;
    overflow-y: auto;
  }
  h1, h2 { color: #e91e63; margin-bottom: 15px; }
  p { line-height: 1.8; font-size: 15px; font-weight: 300; text-align: left; }
  button {
    background: #e91e63;
    color: white;
    border: none;
    padding: 14px 28px;
    border-radius: 50px;
    font-size: 16px;
    cursor: pointer;
    margin: 8px;
    transition: 0.3s;
    font-family: 'Poppins';
  }
  button:hover { transform: scale(1.08); background: #d81b60; }
  .heart {
    position: absolute;
    color: #e91e63;
    font-size: 18px;
    animation: fall 4s linear infinite;
    z-index: 1;
  }
  @keyframes fall {
    0% { transform: translateY(-100vh); opacity: 1; }
    100% { transform: translateY(100vh); opacity: 0; }
  }
  #game, #note { display: none; }
  #counter { font-size: 26px; color: #e91e63; font-weight: 600; }
  /* kursor kedip pas ngetik */
  #typing-text::after {
    content: '|';
    animation: blink 0.7s infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
</style>
</head>
<body>

<div class="container" id="menu">
  <h1>happy 1st monthsarry ❤️</h1>
  <p style="text-align:center;">for my pretty boy</p>
  <button onclick="startGame()">play game 💌</button>
  <button onclick="showNote()">open letter</button>
</div>

<div class="container" id="game">
  <h2>click the heart as fast as you can!</h2>
  <p style="text-align:center;">score: <span id="counter">0</span></p>
  <button onclick="addLove()">❤️ click me ❤️</button>
  <button onclick="backMenu()">back</button>
</div>

<div class="container" id="note">
  <h2>for my pretty boy ❤️</h2>
  <p id="typing-text"></p>
  <button onclick="backMenu()">back</button>
</div>

<script>
  let score = 0;
  function startGame(){
    document.getElementById('menu').style.display='none';
    document.getElementById('game').style.display='block';
  }
  function showNote(){
    document.getElementById('menu').style.display='none';
    document.getElementById('note').style.display='block';
    startTyping(); // mulai ngetik pas dibuka
  }
  function backMenu(){
    document.getElementById('menu').style.display='block';
    document.getElementById('game').style.display='none';
    document.getElementById('note').style.display='none';
  }
  function addLove(){
    score++;
    document.getElementById('counter').innerText = score;
  }
  setInterval(()=>{
    let heart = document.createElement('div');
    heart.classList.add('heart');
    heart.innerHTML = '❤️';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.animationDuration = Math.random() * 2 + 2 + 's';
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(), 4000);
  }, 250);

  // EFEK NGETIK
  const text = `happy 1st monthsarry, my love.

i love you so much my heart could literally explode. my pretty boy, i love you more than you'll ever know. i'm so grateful to be your boyfriend. happy one month to my baby.

thank you for making me feel loved and for making me feel like i'm enough. being with you just feels like home.

you mean the absolute world to me and i really hope i never lose you. you're the sweetest, most caring, most loving boy i could ever ask for. ml, if you're having hard days, please tell me okay? you know i'll always listen to you. and thank you for letting me into your life. thank you for choosing me.

i hope we get to have so many more months, so many more years together, my love. i hope we get to make a bunch of little memories along the way.

please always remember to take care of yourself. and please know that my feelings for you are real and genuine. i'm not going anywhere.

— with all my love, sammy`;

  let i = 0;
  function startTyping() {
    document.getElementById('typing-text').innerHTML = "";
    i = 0;
    typeWriter();
  }

  function typeWriter() {
    if (i < text.length) {
      let char = text.charAt(i) === '\n' ? '<br>' : text.charAt(i);
      document.getElementById('typing-text').innerHTML += char;
      i++;
      setTimeout(typeWriter, 35); // kecepatan ngetik
    }
  }
</script>

</body>
</html>
