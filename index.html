<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>happy 1st monthsarry ❤️</title>
  <style>
    body {
      background: linear-gradient(#ffe6f0, #fff);
      font-family: 'Poppins', sans-serif;
      text-align: center;
      padding: 60px 20px;
      color: #333;
    }
    h1 { color: #e91e63; }
    .note {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(233,30,99,0.2);
      max-width: 500px;
      margin: 30px auto;
    }
    .heart { font-size: 50px; animation: beat 1s infinite; }
    @keyframes beat { 0%,100%{transform:scale(1);} 50%{transform:scale(1.2);} }
  </style>
</head>
<body>
  <div class="heart">❤️</div>
  <h1>happy 1st monthsarry</h1>
  <div class="note">
    <p>To my favorite person,<br><br>
    Makasih udah jadi rumah paling nyaman aku.<br>
    I love the rain, but I love you more 🌧️<br><br>
    — with love
    </p>
  </div>
</body>
</html>
